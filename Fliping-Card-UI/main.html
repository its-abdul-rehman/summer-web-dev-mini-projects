<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fliping Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="card-inner">
                <header>
                    <span class="logo">
                        <img src="logo.png" alt="Logo">
                        <h5>Master Card</h5>
                    </span>
                    <img src="chip.png" alt="Chip" class="chip">
                </header>
                <div class="card-details">
                    <div class="name-number">
                        <h5 class="card">Card Number</h5>
                        <h3 class="number">1234 5678 9012 3456</h3>
                        <h3 class="name">Abdul Rehman</h3>
                </div>
                <div class="valid-date">
                        <h6>valid Thru</h6>
                        <h5>12/24</h5>
                    </div>
            </div>
            <div class="card-back"></div>
        </div>
    </section>
</body>
</html>
