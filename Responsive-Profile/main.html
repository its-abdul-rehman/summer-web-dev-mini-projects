<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile</title>
    <link rel="stylesheet" href="style.css">
    <link  href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href='https://unpkg.com/boxicons@2.1.4/dist/boxicons.js' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="C:\Users\Abdul Rehman\OneDrive\Desktop\GitDemo\summer-web-dev-mini-projects\Responsive-Profile\DSC_0639.1.JPG" alt="" class="profile-image">
        </div>
        <div class="text-data">
            <span class="name">Abdul Rehman</span>
            <span class="job">Student</span>
        </div>
        <div class="media-button">
            <a href="#"  style="background-color: #0077B5;" class="links">
            <i class='bx bxl-linkedin-square'></i></a>
            <a href="#" style="background-color:rgb(48, 45, 45)" class="links">
            <i class='bx bxl-github'></i></a>
            <a href="#" style="background-color: #1DA1F2;" class="links">
            <i class='bx bxl-twitter'></i></a>
            <a href="#" style="background-color:#128C7E" class="links">
            <i class='bx bxl-whatsapp'></i></a>
        </div>
        <div class="buttons">
            <button class="button">Follow</button>&nbsp;&nbsp;
            <button class="button">Contact</button>
        </div>
        <div class="analytics">
            <div class="data">
            <i class='bx bx-heart'></i>
            <span class="number">1.2k</span></div>
            <div class="data">
            <i class='bx bx-message-rounded-dots'></i>
            <span class="number">500</span>
            </div>
            <div class="data">
            <i class='bx bx-share-alt'></i>
            <span class="number">200</span>
            </div>
        </div>
    </div>
</body>
</html>
